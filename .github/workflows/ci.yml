name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: postonce
          POSTGRES_PASSWORD: postonce_ci
          POSTGRES_DB: postonce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postonce -d postonce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postonce:postonce_ci@127.0.0.1:5432/postonce
      POSTONCE_TEST_DATABASE_URL: postgresql://postonce:postonce_ci@127.0.0.1:5432/postonce
      DEMO_STORE: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node database/migrate.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
