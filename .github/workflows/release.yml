name: Release production images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postonce-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22.23.2"
  CI: "true"

jobs:
  checks:
    name: Verify repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: postonce
          POSTGRES_PASSWORD: postonce_release_ci
          POSTGRES_DB: postonce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postonce -d postonce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postonce:postonce_release_ci@127.0.0.1:5432/postonce
      POSTONCE_TEST_DATABASE_URL: postgresql://postonce:postonce_release_ci@127.0.0.1:5432/postonce
      DEMO_STORE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply production SQL migrations to the release database
        run: node database/migrate.mjs
      - name: Install the release browser
        run: npx playwright install --with-deps chromium
      - name: Run repository and browser checks
        run: npm run verify
      - name: Validate production operations files
        shell: bash
        env:
          POSTGRES_PASSWORD: validation-only
          DATABASE_URL: postgresql://postonce:validation-only@db:5432/postonce
          POSTONCE_API_IMAGE: ghcr.io/yazanbaker94/postonce-api:validation-only
          POSTONCE_GATEWAY_IMAGE: ghcr.io/yazanbaker94/postonce-gateway:validation-only
        run: |
          set -euo pipefail
          for script in infra/scripts/*.sh; do
            sh -n "$script"
          done
          docker compose -f infra/compose.yaml config --quiet
          docker run --rm -i caddy:2.11.4-alpine \
            caddy adapt --config /dev/stdin --adapter caddyfile --validate \
            < infra/caddy/Caddyfile > /dev/null
          docker run --rm -i caddy:2.11.4-alpine \
            caddy adapt --config /dev/stdin --adapter caddyfile --validate \
            < infra/caddy/host-site.caddy > /dev/null

  images:
    name: Publish ${{ matrix.component }} image
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component:
          - api
          - gateway
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/postonce-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=tag
      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.component }}.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=postonce-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=postonce-${{ matrix.component }}
          provenance: mode=max
          sbom: true
      - name: Record published digest
        shell: bash
        run: printf '%s\n' '${{ steps.build.outputs.digest }}' > 'postonce-${{ matrix.component }}.digest'
      - uses: actions/upload-artifact@v4
        with:
          name: postonce-digest-${{ matrix.component }}
          path: postonce-${{ matrix.component }}.digest
          if-no-files-found: error
          retention-days: 30

  operations-bundle:
    name: Create digest-pinned operations bundle
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: postonce-digest-*
          path: digests
          merge-multiple: true
      - name: Assemble immutable deployment artifact
        shell: bash
        run: |
          set -euo pipefail
          api_digest="$(tr -d '\r\n' < digests/postonce-api.digest)"
          gateway_digest="$(tr -d '\r\n' < digests/postonce-gateway.digest)"
          [[ "$api_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$gateway_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          mkdir operations
          cp -R infra operations/infra
          {
            printf 'SOURCE_REPOSITORY=%s\n' "$GITHUB_REPOSITORY"
            printf 'SOURCE_REVISION=%s\n' "$GITHUB_SHA"
            printf 'POSTONCE_API_IMAGE=ghcr.io/%s/postonce-api@%s\n' "$owner" "$api_digest"
            printf 'POSTONCE_GATEWAY_IMAGE=ghcr.io/%s/postonce-gateway@%s\n' "$owner" "$gateway_digest"
          } > operations/release-manifest.env
          archive="postonce-operations-${GITHUB_SHA}.tgz"
          tar -C operations -czf "$archive" infra release-manifest.env
          sha256sum "$archive" > "$archive.sha256"
          cp operations/release-manifest.env ./release-manifest.env
      - uses: actions/upload-artifact@v4
        with:
          name: postonce-operations-${{ github.sha }}
          path: |
            postonce-operations-${{ github.sha }}.tgz
            postonce-operations-${{ github.sha }}.tgz.sha256
            release-manifest.env
          if-no-files-found: error
          retention-days: 30
